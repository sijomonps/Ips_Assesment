<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <h1>📚 Book Tracker</h1>
      <p class="subtitle">Keep track of the books you want to read, are reading, and have finished.</p>
    </header>

    <!-- Book Entry Form -->
    <main>
      <section class="card form-card">
        <h2>Add a New Book</h2>
        <form id="book-form" novalidate>
          <!-- Title Input -->
          <div class="form-group">
            <label for="book-title">Book Title <span class="required">*</span></label>
            <input 
              type="text" 
              id="book-title" 
              name="title" 
              placeholder="e.g. The Hobbit"
              autocomplete="off"
            >
            <p class="error-message" id="title-error" role="alert"></p>
          </div>

          <!-- Author Input -->
          <div class="form-group">
            <label for="book-author">Author <span class="required">*</span></label>
            <input 
              type="text" 
              id="book-author" 
              name="author" 
              placeholder="e.g. J.R.R. Tolkien"
              autocomplete="off"
            >
            <p class="error-message" id="author-error" role="alert"></p>
          </div>

          <!-- Status Dropdown -->
          <div class="form-group">
            <label for="book-status">Reading Status</label>
            <select id="book-status" name="status">
              <option value="To read">To read</option>
              <option value="Reading">Reading</option>
              <option value="Finished">Finished</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="add-book-btn" class="btn btn-primary">Add Book</button>
        </form>
      </section>

      <!-- Book List Section -->
      <section class="card list-card">
        <div class="list-header">
          <h2>My Books</h2>
        </div>

        <!-- Status Counters -->
        <div class="status-counts" aria-label="Book reading status counts">
          <div class="count-badge count-all">Total: <strong id="count-total">0</strong></div>
          <div class="count-badge count-to-read">To read: <strong id="count-to-read">0</strong></div>
          <div class="count-badge count-reading">Reading: <strong id="count-reading">0</strong></div>
          <div class="count-badge count-finished">Finished: <strong id="count-finished">0</strong></div>
        </div>
        
        <!-- Search Input -->
        <div class="search-group">
          <label for="search-input" class="visually-hidden">Search books by title or author</label>
          <input 
            type="search" 
            id="search-input" 
            class="search-input" 
            placeholder="🔍 Search by title or author..."
            autocomplete="off"
          >
        </div>

        <!-- Empty state placeholder -->
        <p id="empty-state" class="empty-state">No books added yet. Use the form above to add your first book!</p>

        <!-- Dynamic List of Books -->
        <ul id="book-list" class="book-list" aria-label="Book list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
